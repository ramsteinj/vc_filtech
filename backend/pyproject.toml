[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
# Line length is enforced by `ruff format`; long Korean message strings cannot be split.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
